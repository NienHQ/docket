name: perf

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # allowed to be slow, not allowed to crash (plan task 1.3)
      - run: node scripts/perf.mjs --messages 15000
